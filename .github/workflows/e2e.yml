name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1-5" # weekdays 09:00 UTC: catch changes in the demo site under test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - run: npm run lint
      - run: npm run format:check
      - name: Unit tests (AI failure analyzer, fake client)
        run: npm run test:unit

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Run Cypress on ${{ matrix.browser }}
        uses: cypress-io/github-action@v7
        with:
          browser: ${{ matrix.browser }}
        env:
          # Optional repository secrets; the public demo credentials are used when unset.
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # Claude root-cause analysis of failed tests runs only when the secret is configured.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_ANALYSIS: ${{ secrets.ANTHROPIC_API_KEY != '' }}

      - name: Add Claude failure analysis to the job summary
        if: failure() && hashFiles('ai-analysis.md') != ''
        run: |
          echo "## Claude failure analysis (${{ matrix.browser }})" >> "$GITHUB_STEP_SUMMARY"
          cat ai-analysis.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results
          retention-days: 14

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.browser }}
          path: cypress/screenshots
          retention-days: 14

  report:
    needs: test
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Download Allure results from all browsers
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Restore trend history from the published report
        continue-on-error: true
        run: |
          git fetch --depth 1 origin gh-pages
          mkdir -p history
          git show origin/gh-pages:history/history.jsonl > history/history.jsonl

      - name: Generate Allure report
        run: |
          npm run report:generate
          mkdir -p allure-report/history
          cp history/history.jsonl allure-report/history/ 2>/dev/null || true

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
